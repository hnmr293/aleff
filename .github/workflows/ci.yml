name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          cache-suffix: lint

      - name: Pyright
        run: uv run pyright src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Ruff check
        run: uv run ruff check

  test:
    name: "Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          cache-suffix: "test-${{ matrix.python-version }}"

      - name: Configure Windows crash dumps
        if: runner.os == 'Windows' && matrix.python-version == '3.14t'
        shell: pwsh
        run: |
          $dumpDirectory = Join-Path $env:RUNNER_TEMP "crash-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDirectory
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps"
          New-Item -Path $key -Force
          New-ItemProperty -Path $key -Name DumpFolder -Value $dumpDirectory -PropertyType ExpandString -Force
          New-ItemProperty -Path $key -Name DumpCount -Value 2 -PropertyType DWord -Force
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force

      - name: Run tests
        shell: bash
        run: ./run_tests_one.sh "${{ matrix.python-version }}"

      - name: Analyze Windows crash dump
        if: failure() && runner.os == 'Windows' && matrix.python-version == '3.14t'
        shell: pwsh
        run: |
          $dump = Get-ChildItem (Join-Path $env:RUNNER_TEMP "crash-dumps") -Filter "*.dmp" |
            Select-Object -First 1
          if (-not $dump) {
            Write-Host "No crash dump was produced."
            exit 0
          }
          $cdbCandidates = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe",
            "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe"
          )
          $cdb = $cdbCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cdb) {
            Write-Host "cdb.exe is unavailable; preserving the dump as an artifact."
            exit 0
          }
          & $cdb -z $dump.FullName -c ".symfix; .reload; .ecxr; r; kP; lm; q"

      - name: Upload Windows crash dump
        if: always() && runner.os == 'Windows' && matrix.python-version == '3.14t'
        uses: actions/upload-artifact@v7
        with:
          name: windows-3.14t-crash-dump
          path: ${{ runner.temp }}/crash-dumps/*.dmp
          if-no-files-found: ignore
          retention-days: 1
