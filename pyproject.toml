[project]
name = "aleff"
version = "0.4.1"
description = "Algebraic effects for Python — deep and shallow, stateful, composable, multi-shot handlers"
readme = "README.md"
license = "Apache-2.0 AND PSF-2.0"
license-files = [
    "LICENSE",
    "LICENSES/CPython.txt",
    "NOTICE",
]
requires-python = ">=3.12,<3.15"
authors = [
    { name = "hnmr" },
]
keywords = [
    "Python",
    "greenlet",
    "algebraic-effects",
    "effects",
    "effect systems",
    "delimited-continuations",
    "multi-shot continuations",
    "stateful handlers",
    "deep handlers",
    "shallow handlers",
    "composable handlers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "greenlet>=3.3.2; python_version < '3.14'",
    "greenlet>=3.3.2,<3.4.0; python_full_version >= '3.14' and python_full_version < '3.14.4'",
    "greenlet>=3.5.5; python_full_version >= '3.14.4'",
]

[project.urls]
Homepage = "https://github.com/hnmr293/aleff"
Repository = "https://github.com/hnmr293/aleff"
Issues = "https://github.com/hnmr293/aleff/issues"

[dependency-groups]
dev = [
    "gdb-mcp; sys_platform != 'win32'",
    "myst-parser>=5.0.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.10.0",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
# Apply the exclusions below even when a file is named on the command line, so that
# checking a single file from an editor gives the same answer as CI.
force-exclude = true

[tool.ruff.lint]
# Archived one-shot implementations, kept as development history and unreachable from
# the public API (`_oneshot/__init__.py` exposes only `v8_1`, which stays in scope).
# Keep in sync with the `ignore` list in pyrightconfig.json.
exclude = ["src/aleff/_oneshot/v[1-8]/**"]

[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*", "cp314t-*"]
skip = ["*-manylinux_i686", "*-musllinux_*", "*-win32"]
build-frontend = "build[uv]"
test-command = 'pytest {project}/tests -q --ignore-glob="*/test_cpython_compat_*.py"'
test-requires = [
    "pytest",
    "pytest-asyncio",
]

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.uv.sources]
gdb-mcp = { git = "https://github.com/hnmr293/gdb-mcp" }
